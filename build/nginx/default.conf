server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing — send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # WP-65: the entry documents name the hashed chunks, and version.json tells open tabs a newer
    # build is live — none of them may be cached (same policy as S3/CloudFront). The SPA fallback
    # (try_files -> /index.html) is an internal redirect, so it lands here too.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # WP-51: /maintenance.json (the maintenance valve) is proxied to the CloudFront copy, so the
    # one "Maintenance mode" GitHub Action flips K3s too. The location block is generated at
    # container start by docker-entrypoint.sh from MAINTENANCE_FLAG_URL (it needs the pod's DNS
    # resolver, known only at runtime). Any upstream failure returns an error the SPA reads as OFF.
    include /etc/nginx/maintenance-flag.conf;

    # Cache static assets (JS, CSS, images) — Vite hashes filenames so long cache is safe
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
